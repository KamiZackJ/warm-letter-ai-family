<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="暖笺互动产品演示：从素材到家书阅读与回复的本地可操作闭环。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%2320574d'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='white'%3E%E7%AC%BA%3C/text%3E%3C/svg%3E" />
    <title>暖笺 | 互动产品演示</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172723;
        --muted: #5f6b66;
        --canvas: #eef1eb;
        --paper: #fcfdf9;
        --paper-muted: #f4f6f1;
        --pine: #20574d;
        --pine-soft: #d9e8e1;
        --coral: #d95d45;
        --coral-soft: #f8dfd7;
        --sun: #e8b940;
        --sun-soft: #fbefc9;
        --sky: #3d89a7;
        --sky-soft: #dcecf2;
        --line: #c7d1ca;
        --line-dark: #9faea5;
        --shadow: 0 18px 48px rgba(29, 54, 45, 0.12);
        --display: "Source Han Serif SC", "Noto Serif CJK SC", SimSun, serif;
        --body: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        --mono: Consolas, "Courier New", monospace;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(23, 39, 35, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 39, 35, 0.035) 1px, transparent 1px),
          var(--canvas);
        background-size: 32px 32px;
        font-family: var(--body);
        letter-spacing: 0;
      }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      a { color: inherit; }
      :focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
      .skip-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 100;
        padding: 9px 13px;
        color: #fff;
        background: var(--pine);
        transform: translateY(-140%);
      }
      .skip-link:focus { transform: translateY(0); }

      .app-shell { max-width: 1440px; margin: 0 auto; padding: 0 28px 48px; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        min-height: 76px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 23px; font-weight: 700; text-decoration: none; }
      .brand-mark {
        display: grid;
        width: 31px;
        height: 31px;
        place-items: center;
        color: #fff;
        background: var(--pine);
        border-radius: 50%;
        font-family: var(--display);
        font-size: 18px;
      }
      .top-actions { display: flex; align-items: center; gap: 10px; }
      .local-tag, .source-tag, .status-pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 3px 9px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }
      .local-tag { color: var(--pine); background: var(--pine-soft); }
      .quiet-button, .icon-button {
        border: 1px solid var(--line-dark);
        color: var(--ink);
        background: transparent;
      }
      .quiet-button { min-height: 36px; padding: 0 11px; border-radius: 4px; font-size: 13px; }
      .quiet-button:hover { background: var(--paper); }
      .icon-button { display: inline-grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; font-size: 17px; }
      .icon-button:hover { color: #fff; background: var(--pine); border-color: var(--pine); }

      .demo-note {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 20px 0 18px;
        padding: 12px 14px;
        border-left: 4px solid var(--sky);
        color: #2e4d5a;
        background: var(--sky-soft);
        font-size: 13px;
        line-height: 1.6;
      }
      .demo-note b { color: #1f556a; white-space: nowrap; }
      .demo-note a { flex: none; color: #1f556a; font-weight: 750; text-underline-offset: 3px; }
      .demo-note a:hover { color: var(--pine); }

      .journey {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        margin-bottom: 24px;
        border: 1px solid var(--line);
        background: rgba(252, 253, 249, 0.78);
      }
      .journey-step {
        display: flex;
        min-height: 68px;
        align-items: center;
        gap: 10px;
        padding: 12px 15px;
        border: 0;
        border-right: 1px solid var(--line);
        color: var(--muted);
        background: transparent;
        text-align: left;
      }
      .journey-step:last-child { border-right: 0; }
      .journey-step:hover { background: var(--paper); }
      .journey-step.current { color: var(--ink); background: var(--paper); box-shadow: inset 0 -4px 0 var(--pine); }
      .journey-step.done .step-dot { color: #fff; background: var(--pine); border-color: var(--pine); }
      .step-dot { display: grid; flex: 0 0 auto; width: 28px; height: 28px; place-items: center; border: 1px solid var(--line-dark); border-radius: 50%; font-family: var(--mono); font-size: 11px; font-weight: 700; }
      .step-copy { display: grid; gap: 2px; }
      .step-copy b { font-size: 13px; }
      .step-copy span { font-size: 11px; }

      .workspace { display: grid; grid-template-columns: 264px minmax(0, 1fr) 280px; gap: 16px; align-items: stretch; }
      .rail, .inspector, .composer { min-width: 0; background: rgba(252, 253, 249, 0.84); border: 1px solid var(--line); }
      .rail, .inspector { padding: 16px; }
      .panel-kicker { margin: 0; color: var(--muted); font-family: var(--mono); font-size: 11px; font-weight: 700; }
      .panel-title { margin: 6px 0 0; font-size: 16px; }
      .subtle { color: var(--muted); font-size: 12px; line-height: 1.65; }

      .material-list { display: grid; gap: 9px; margin: 16px 0; }
      .material {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 18px;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 70px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--ink);
        background: var(--paper-muted);
        text-align: left;
      }
      .material:hover { border-color: var(--pine); background: var(--paper); }
      .material.selected { border-color: var(--pine); box-shadow: inset 3px 0 0 var(--pine); }
      .material-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; font-size: 17px; }
      .material-icon.photo { color: #914332; background: var(--coral-soft); }
      .material-icon.voice { color: #246379; background: var(--sky-soft); }
      .material-icon.note { color: #70530b; background: var(--sun-soft); }
      .material-copy { min-width: 0; }
      .material-copy b, .material-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .material-copy b { font-size: 13px; }
      .material-copy span { margin-top: 3px; color: var(--muted); font-size: 11px; }
      .select-mark { color: var(--pine); font-size: 16px; }
      .material:not(.selected) .select-mark { color: var(--line-dark); }
      .privacy-view {
        position: relative;
        overflow: hidden;
        min-height: 116px;
        margin-top: 12px;
        border: 1px solid var(--line);
        background: var(--paper-muted);
      }
      .privacy-view::before {
        position: absolute;
        inset: 0;
        content: "受控媒体未装入\A 请打开受控 CASE-001 包查看真实照片";
        display: grid;
        place-items: center;
        padding: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
        white-space: pre-line;
      }
      .privacy-view.has-media { min-height: 260px; background: #16231f; }
      .privacy-view.has-media::before { display: none; }
      .privacy-view img { display: block; width: 100%; height: 100%; min-height: 260px; max-height: 360px; object-fit: contain; }
      .privacy-mask {
        position: absolute;
        right: 6px;
        bottom: 6px;
        padding: 4px 6px;
        color: #fff;
        background: rgba(23, 39, 35, 0.82);
        font-family: var(--mono);
        font-size: 9px;
      }
      .source-audio { margin-top: 10px; padding: 10px; border: 1px solid var(--line); background: var(--paper-muted); }
      .source-audio b, .source-audio span { display: block; }
      .source-audio b { font-size: 12px; }
      .source-audio span { margin: 3px 0 8px; color: var(--muted); font-size: 10px; line-height: 1.5; }
      .source-audio audio { display: block; width: 100%; height: 34px; }
      .source-audio a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 5px; color: var(--pine); font-size: 11px; font-weight: 700; }
      .rail-footer { margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--line); }

      .composer { position: relative; min-height: 620px; }
      .composer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
      .composer-head h1 { margin: 4px 0 0; font-family: var(--display); font-size: 28px; line-height: 1.2; }
      .composer-meta { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
      .count { color: var(--pine); background: var(--pine-soft); }
      .compose-body { padding: 22px; }
      .empty-state { display: grid; min-height: 400px; place-items: center; text-align: center; }
      .empty-state > div { max-width: 420px; }
      .empty-seal { display: grid; width: 82px; height: 82px; place-items: center; margin: 0 auto 20px; border: 1px solid var(--pine); border-radius: 50%; color: var(--pine); font-family: var(--display); font-size: 39px; }
      .empty-state h2 { margin: 0; font-family: var(--display); font-size: 25px; }
      .empty-state p { margin: 12px auto 22px; color: var(--muted); font-size: 14px; line-height: 1.8; }
      .primary-button, .secondary-button, .state-action {
        min-height: 44px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 700;
      }
      .primary-button { padding: 0 16px; border: 1px solid var(--pine); color: #fff; background: var(--pine); }
      .primary-button:hover:not(:disabled) { background: #163f38; }
      .secondary-button { padding: 0 13px; border: 1px solid var(--line-dark); color: var(--ink); background: var(--paper); }
      .secondary-button:hover:not(:disabled) { border-color: var(--pine); color: var(--pine); }
      .draft-picker { max-width: 670px; margin: 0 auto 12px; }
      .draft-picker-label { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 7px; color: var(--muted); font-size: 11px; }
      .draft-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-dark); background: var(--paper-muted); }
      .draft-tab { min-height: 52px; padding: 7px 9px; border: 0; border-right: 1px solid var(--line); color: var(--muted); background: transparent; text-align: left; }
      .draft-tab:last-child { border-right: 0; }
      .draft-tab b, .draft-tab span { display: block; }
      .draft-tab b { color: var(--ink); font-size: 12px; }
      .draft-tab span { margin-top: 2px; font-size: 10px; }
      .draft-tab.active { color: #fff; background: var(--pine); }
      .draft-tab.active b { color: #fff; }
      .draft-sheet { max-width: 670px; margin: 0 auto; padding: 28px clamp(18px, 4vw, 48px) 34px; border: 1px solid #d8ddd7; background: var(--paper); box-shadow: 7px 8px 0 rgba(32, 87, 77, 0.09); }
      .letter-date { color: var(--muted); font-family: var(--mono); font-size: 11px; text-align: right; }
      .letter-title { margin: 24px 0 22px; font-family: var(--display); font-size: 29px; line-height: 1.25; text-align: center; }
      .letter-greeting, .letter-closing { margin: 16px 0; color: #30433d; font-size: 15px; line-height: 1.7; }
      .paragraph-wrap { position: relative; margin: 16px 0; padding-left: 16px; border-left: 3px solid transparent; }
      .paragraph-wrap.active { border-left-color: var(--sun); }
      .paragraph-editor { display: block; width: 100%; min-height: 92px; resize: vertical; overflow: auto; padding: 5px 7px; border: 1px solid transparent; border-radius: 3px; color: var(--ink); background: transparent; font-family: var(--display); font-size: 17px; line-height: 1.9; }
      .paragraph-editor:hover { background: var(--paper-muted); }
      .paragraph-editor:focus { border-color: var(--pine); outline: none; background: #fff; }
      .paragraph-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 6px; padding-left: 7px; }
      .source-tag { min-height: 22px; padding: 3px 7px; font-family: var(--body); font-size: 11px; font-weight: 600; }
      .tag-ai { color: #286153; background: var(--pine-soft); }
      .tag-review { color: #94422f; background: var(--coral-soft); }
      .tag-confirmed { color: #1e5d72; background: var(--sky-soft); }
      .tag-user { color: #765809; background: var(--sun-soft); }
      .source-ref { color: var(--muted); font-size: 11px; }
      .source-review {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        margin: 12px 0 3px 7px;
        padding: 12px;
        border: 1px dashed var(--coral);
        background: #fff8f5;
      }
      .source-review h3 { margin: 0 0 5px; font-size: 13px; }
      .source-review p { margin: 0; color: #70473d; font-size: 12px; line-height: 1.55; }
      .review-source-options { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .review-source-option { display: inline-flex; align-items: center; min-height: 44px; gap: 8px; padding: 5px 10px; border: 1px solid #d6b6ab; color: #70473d; background: #fff; font-size: 11px; }
      .review-source-option input { width: 20px; height: 20px; margin: 0; accent-color: var(--pine); }
      .review-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
      .state-action { padding: 0 10px; border: 1px solid var(--line-dark); color: var(--ink); background: #fff; font-size: 12px; }
      .state-action:hover { border-color: var(--pine); color: var(--pine); }
      .state-action.user { border-color: #d2b866; color: #73540a; }
      .letter-signature { margin: 28px 0 0; color: #30433d; font-family: var(--display); font-size: 16px; line-height: 1.75; text-align: right; }
      .provenance-strip { display: flex; align-items: center; gap: 9px; margin-top: 24px; padding-top: 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .threads { display: flex; gap: 3px; }
      .thread { display: block; width: 22px; height: 4px; border-radius: 99px; }
      .thread.photo { background: var(--coral); }
      .thread.voice { background: var(--sky); }
      .thread.note { background: var(--sun); }

      .inspector { display: flex; flex-direction: column; }
      .state-ledger { display: grid; gap: 10px; margin: 17px 0; }
      .ledger-row { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 9px; align-items: start; }
      .ledger-dot { width: 10px; height: 10px; margin-top: 4px; border: 1px solid var(--line-dark); border-radius: 50%; background: var(--paper); }
      .ledger-dot.current { background: var(--pine); border-color: var(--pine); }
      .ledger-dot.review { background: var(--coral); border-color: var(--coral); }
      .ledger-row b { display: block; font-size: 12px; }
      .ledger-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .confirmation { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--line); }
      .confirmation h2 { margin: 0; font-size: 16px; }
      .confirmation p { margin: 8px 0 13px; color: var(--muted); font-size: 12px; line-height: 1.65; }
      .confirmation .primary-button { width: 100%; }
      .safety-note { margin-top: 13px; padding: 10px; border-left: 3px solid var(--sun); background: var(--sun-soft); color: #674d0b; font-size: 11px; line-height: 1.55; }

      .reader-stage { display: grid; grid-template-columns: minmax(0, 1fr) 450px minmax(0, 1fr); gap: 20px; align-items: start; }
      .sent-context { padding: 24px; border-top: 4px solid var(--pine); background: var(--paper); box-shadow: var(--shadow); }
      .sent-context h1 { margin: 9px 0 12px; font-family: var(--display); font-size: 29px; line-height: 1.25; }
      .sent-context p { color: var(--muted); font-size: 14px; line-height: 1.75; }
      .sent-steps { display: grid; gap: 13px; margin: 24px 0; }
      .sent-step { display: grid; grid-template-columns: 29px minmax(0, 1fr); gap: 10px; align-items: start; }
      .sent-step b { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 50%; color: #fff; background: var(--pine); font-family: var(--mono); font-size: 11px; }
      .sent-step span { color: var(--muted); font-size: 12px; line-height: 1.55; }
      .reader-phone { overflow: hidden; border: 9px solid #18342e; border-radius: 32px; background: #f8faf7; box-shadow: 0 24px 64px rgba(23, 39, 35, 0.25); }
      .phone-top { display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 14px; color: #fff; background: #18342e; }
      .phone-title { font-size: 14px; font-weight: 700; }
      .phone-icon { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid rgba(255,255,255,.45); border-radius: 50%; color: #fff; background: transparent; font-size: 12px; }
      .reader-controls { display: flex; justify-content: space-between; gap: 6px; padding: 11px 13px; border-bottom: 1px solid #d7ddd8; background: #fff; }
      .reader-control { flex: 1; min-height: 44px; border: 1px solid #cdd7d0; border-radius: 3px; color: #325047; background: #f6f8f5; font-size: 11px; }
      .reader-control.active { color: #fff; background: var(--pine); border-color: var(--pine); }
      .reader-content { min-height: 530px; padding: 23px 20px; }
      .reader-content.size-large { font-size: 18px; }
      .reader-content.size-extra { font-size: 20px; }
      .reader-date { color: var(--muted); font-size: 10px; }
      .reader-title { margin: 18px 0 12px; font-family: var(--display); font-size: 26px; line-height: 1.25; }
      .reader-content.size-large .reader-title { font-size: 28px; }
      .reader-content.size-extra .reader-title { font-size: 30px; }
      .reader-letter { color: #263c35; font-family: var(--display); font-size: 16px; line-height: 1.95; }
      .reader-content.size-large .reader-letter { font-size: 18px; }
      .reader-content.size-extra .reader-letter { font-size: 20px; }
      .reader-letter p { margin: 16px 0; }
      .reader-case-photo { overflow: hidden; margin: 14px 0 20px; border: 1px solid #cfd8d3; background: #16231f; }
      .reader-case-photo img { display: block; width: 100%; max-height: 360px; object-fit: contain; }
      .reader-media-caption { margin: 0; padding: 7px 9px; color: var(--muted); background: #f1f5f1; font-family: var(--body); font-size: 10px; line-height: 1.5; }
      .reader-source { display: flex; flex-wrap: wrap; gap: 5px; margin: -8px 0 13px; }
      .reader-source .source-tag { font-size: 10px; }
      .voice-bar { display: flex; align-items: center; gap: 9px; margin: 20px 0; padding: 10px; border: 1px solid #cfd8d3; background: #f1f5f1; }
      .voice-button { display: grid; flex: 0 0 auto; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; color: #fff; background: var(--sky); }
      .voice-line { flex: 1; height: 3px; background: #b5c9d0; }
      .voice-line span { display: block; width: var(--voice-progress, 0%); height: 3px; background: var(--sky); transition: width .3s ease; }
      .voice-time { color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .voice-bar.real-audio { display: block; }
      .voice-bar.real-audio b { display: block; margin-bottom: 7px; font-family: var(--body); font-size: 11px; }
      .voice-bar.real-audio audio { display: block; width: 100%; height: 36px; }
      .voice-bar.real-audio a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 5px; color: var(--pine); font-size: 11px; font-weight: 700; }
      .reader-signature { text-align: right; }
      .reply-area { padding: 14px; border-top: 1px solid #d7ddd8; background: #fff; }
      .reply-area h2 { margin: 0 0 8px; font-size: 14px; }
      .reply-form { display: flex; gap: 7px; }
      .reply-input { min-width: 0; flex: 1; min-height: 34px; padding: 0 9px; border: 1px solid #c8d3cc; border-radius: 3px; background: #fff; font-size: 12px; }
      .reply-send { width: 44px; min-height: 44px; border: 1px solid var(--pine); border-radius: 3px; color: #fff; background: var(--pine); }
      .reply-list { display: grid; gap: 7px; margin-top: 12px; }
      .reply { padding: 8px 9px; border-left: 3px solid var(--sun); background: #fbf7ea; color: #4d482e; font-size: 12px; line-height: 1.5; }
      .reader-right { display: grid; gap: 16px; }
      .property-sheet { padding: 18px; border: 1px solid var(--line); background: rgba(252,253,249,.86); }
      .property-sheet h2 { margin: 4px 0 13px; font-size: 16px; }
      .property-sheet dl { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; margin: 0; font-size: 12px; }
      .property-sheet dt { color: var(--muted); }
      .property-sheet dd { margin: 0; font-weight: 600; }
      .source-preview { min-height: 156px; padding: 18px; color: #fff; background: var(--pine); }
      .source-preview h2 { margin: 4px 0 10px; font-family: var(--display); font-size: 21px; }
      .source-preview p { margin: 0; color: rgba(255,255,255,.76); font-size: 12px; line-height: 1.6; }
      .source-preview button { width: 100%; margin-top: 15px; min-height: 36px; border: 1px solid rgba(255,255,255,.66); border-radius: 3px; color: #fff; background: transparent; font-size: 12px; font-weight: 700; }
      .source-preview button:hover { color: var(--pine); background: #fff; }

      .evidence-drawer { margin-top: 18px; border: 1px solid var(--line); background: rgba(252,253,249,.78); }
      .evidence-drawer summary { display: flex; align-items: center; min-height: 53px; padding: 0 17px; cursor: pointer; font-size: 14px; font-weight: 700; }
      .evidence-drawer summary::marker { color: var(--pine); }
      .evidence-content { display: grid; grid-template-columns: 1.12fr .88fr; gap: 18px; padding: 0 17px 18px; border-top: 1px solid var(--line); }
      .evidence-content h2 { margin: 18px 0 10px; font-size: 16px; }
      .evidence-list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
      .evidence-list li { padding: 10px 11px; border-left: 3px solid var(--pine); background: var(--paper); font-size: 12px; line-height: 1.5; }
      .evidence-list code { color: #24584d; font-family: var(--mono); font-size: 10px; }
      .evidence-shot { display: block; width: 100%; max-width: 470px; margin: 0 auto; border: 1px solid var(--line); }
      .drawer-note { color: var(--muted); font-size: 11px; line-height: 1.6; }
      .footer { display: flex; justify-content: space-between; gap: 15px; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
      .toast { position: fixed; left: 50%; bottom: 22px; z-index: 20; max-width: min(92vw, 540px); padding: 10px 13px; border: 1px solid var(--ink); color: #fff; background: var(--ink); box-shadow: var(--shadow); font-size: 13px; opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: opacity .16s ease, transform .16s ease; }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 1120px) {
        .workspace { grid-template-columns: 230px minmax(0, 1fr); }
        .inspector { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .state-ledger { margin-bottom: 0; }
        .confirmation { margin-top: 0; padding-top: 0; border-top: 0; }
        .reader-stage { grid-template-columns: minmax(0, 1fr) 410px; }
        .reader-right { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 780px) {
        .app-shell { padding: 0 14px 30px; }
        .topbar { min-height: 64px; }
        .top-actions .quiet-button { display: none; }
        .demo-note { margin-top: 14px; }
        .journey { grid-template-columns: 1fr 1fr; }
        .journey-step:nth-child(2) { border-right: 0; }
        .journey-step:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
        .workspace { grid-template-columns: 1fr; }
        .rail { order: 1; }
        .composer { order: 2; min-height: 0; }
        .inspector { order: 3; grid-column: auto; grid-template-columns: 1fr; }
        .material-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .material { grid-template-columns: 1fr; min-height: 89px; gap: 5px; }
        .material-icon { width: 30px; height: 30px; }
        .material-copy b, .material-copy span { white-space: normal; }
        .select-mark { position: absolute; right: 8px; top: 7px; }
        .material { position: relative; }
        .privacy-view:not(.has-media) { display: none; }
        .privacy-view.has-media { display: block; min-height: 220px; }
        .privacy-view img { min-height: 220px; max-height: 320px; }
        .rail-footer { display: block; }
        .composer-head { padding: 16px; }
        .composer-head h1 { font-size: 24px; }
        .compose-body { padding: 13px; }
        .draft-sheet { padding: 22px 16px; }
        .letter-title { font-size: 25px; }
        .paragraph-editor { font-size: 16px; }
        .source-review { grid-template-columns: 1fr; }
        .reader-stage { grid-template-columns: 1fr; }
        .reader-phone { grid-row: 1; width: min(100%, 420px); margin: 0 auto; }
        .sent-context { grid-row: 2; }
        .reader-right { grid-column: auto; grid-template-columns: 1fr; }
        .evidence-content { grid-template-columns: 1fr; }
        .footer { display: block; }
        .footer span { display: block; margin-top: 6px; }
      }
      @media (max-width: 430px) {
        .journey-step { min-height: 61px; padding: 8px; }
        .step-copy span { display: none; }
        .top-actions { gap: 6px; }
        .local-tag { padding: 3px 6px; font-size: 9px; }
        .reader-content { min-height: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#demo-root">跳到演示内容</a>
    <div id="demo-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./demo-case.js"></script>
    <script>
      const emergencyCase = {
        schemaVersion: 1,
        caseId: "NUANJIAN-CASE-001",
        mode: "configuration-error",
        provenanceLabel: "受控配置未载入",
        disclosure: "demo-case.js 缺失或无效。当前只显示脱敏应急稿，不显示任何照片或语音。",
        photoUrl: null,
        audioUrl: null,
        audioDurationSeconds: 8.895,
        recommendedDraftId: "A",
        drafts: [{ id: "A", label: "应急稿", name: "A｜脱敏应急稿", body: "亲爱的家里人：\n\n今天上午开了个会，结束时有点累。中午的一个小惊喜让心情轻松了一点。\n\n想念你们的我" }],
        evidenceMap: [],
        safetyTests: [],
      };

      function isSafeMediaUrl(value) {
        return value === null || (typeof value === "string" && /^\.\/media\/[A-Za-z0-9._-]+$/.test(value));
      }

      function isValidDemoCase(value) {
        return Boolean(
          value &&
          value.schemaVersion === 1 &&
          (typeof value.caseId === "string" || typeof value.materialId === "string") &&
          Array.isArray(value.drafts) &&
          value.drafts.length > 0 &&
          value.drafts.every((draft) => draft && typeof draft.id === "string" && typeof draft.name === "string" && typeof draft.body === "string") &&
          isSafeMediaUrl(value.photoUrl ?? null) &&
          isSafeMediaUrl(value.audioUrl ?? null),
        );
      }

      const suppliedCase = window.WARM_LETTER_DEMO_CASE;
      const demoCase = isValidDemoCase(suppliedCase) ? suppliedCase : emergencyCase;
      const controlledMedia = demoCase.mode === "controlled-review-snapshot" || demoCase.mode === "controlled-team";
      const demoDisclosure = typeof demoCase.disclosure === "string"
        ? demoCase.disclosure
        : controlledMedia
          ? "本包使用队友提供的受控媒体与固定审核稿；照片为物理裁切派生图，原始照片不在包内。"
          : "当前仓库版不包含队友提供的照片或语音。";
      const safetyTestIds = Array.isArray(demoCase.safetyTests)
        ? demoCase.safetyTests.map((item) => typeof item === "string" ? item : item?.id).filter(Boolean)
        : [];
      const materials = [
        { id: "photo", icon: "▦", type: "photo", name: "队友提供的生活照片", detail: controlledMedia ? "物理裁切派生图 · 货架与 9.9 元价签" : "仓库不含原始照片", selected: true },
        { id: "voice", icon: "◖", type: "voice", name: "队友提供的示例语音", detail: controlledMedia ? "原始 m4a · 8.895 秒" : "仓库不含原始语音", selected: true },
      ];

      const knownMaterialIds = new Set(materials.map((item) => item.id));

      function normalizedSourceRefs(value) {
        if (!Array.isArray(value)) return [];
        return [...new Set(value.filter((id) => typeof id === "string" && knownMaterialIds.has(id)))];
      }

      function paragraphEvidenceForDraft(draft, index) {
        const value = Array.isArray(draft.paragraphEvidence) ? draft.paragraphEvidence[index] : null;
        if (!value || typeof value !== "object") {
          return { evidenceIds: [], sourceRefs: [] };
        }
        return {
          evidenceIds: Array.isArray(value.evidenceIds)
            ? value.evidenceIds.filter((id) => typeof id === "string")
            : [],
          sourceRefs: normalizedSourceRefs(value.sourceRefs),
        };
      }

      function parseApprovedDraft(draft) {
        const blocks = draft.body.trim().split(/\r?\n\s*\r?\n/).map((item) => item.trim()).filter(Boolean);
        const greeting = blocks[0] || "亲爱的家里人：";
        const signature = blocks.length > 1 ? blocks[blocks.length - 1] : "想念你们的我";
        const bodyBlocks = blocks.slice(1, -1);
        return {
          greeting,
          signature,
          paragraphs: (bodyBlocks.length ? bodyBlocks : [""]).map((text, index) => {
            const evidence = paragraphEvidenceForDraft(draft, index);
            return {
              id: `${draft.id}-p${index + 1}`,
              text,
              evidenceIds: evidence.evidenceIds,
              sourceRefs: evidence.sourceRefs,
              // These paragraphs come directly from the teammate-reviewed draft.
              // A user edit changes the attribution to needs-review before it can be confirmed.
              attribution: "reviewed-fixed",
            };
          }),
        };
      }

      const approvedDrafts = demoCase.drafts;
      const recommendedDraft = approvedDrafts.find((draft) => draft.id === demoCase.recommendedDraftId) || approvedDrafts[0];
      const initialDraft = parseApprovedDraft(recommendedDraft);
      const initialParagraphs = initialDraft.paragraphs;

      const state = {
        generated: false,
        published: false,
        dirty: false,
        selected: new Set(materials.filter((item) => item.selected).map((item) => item.id)),
        paragraphs: structuredClone(initialParagraphs),
        greeting: initialDraft.greeting,
        signature: initialDraft.signature,
        selectedDraftId: recommendedDraft.id,
        activeParagraph: initialParagraphs[0]?.id || "",
        showSources: false,
        readerSize: "standard",
        replies: [],
        speaking: false,
        toastTimer: null,
      };

      const attributionMeta = {
        "reviewed-fixed": { label: "固定审核稿，依据已核对", className: "tag-ai" },
        "needs-review": { label: "修改后待核对依据", className: "tag-review" },
        "sources-confirmed": { label: "已确认所选素材依据", className: "tag-confirmed" },
        "user-supplied": { label: "写信人补充，无素材依据", className: "tag-user" },
      };

      const materialMap = Object.fromEntries(materials.map((item) => [item.id, item]));
      const root = document.querySelector("#demo-root");
      const toast = document.querySelector("#toast");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function selectedNames(refs) {
        return refs.map((id) => materialMap[id]?.name).filter(Boolean).join(" · ");
      }

      function selectedReviewSourceRefs(paragraph) {
        return normalizedSourceRefs(paragraph.reviewSourceRefs)
          .filter((id) => state.selected.has(id));
      }

      function draftDisplayName(draft) {
        return draft.name.startsWith(`${draft.id}｜`)
          ? draft.name
          : `${draft.id}｜${draft.name}${draft.label && draft.label !== draft.name ? `（${draft.label}）` : ""}`;
      }

      function needsReview() {
        return state.paragraphs.some((item) => item.attribution === "needs-review");
      }

      function resolvedCount() {
        return state.paragraphs.filter((item) => item.attribution !== "needs-review").length;
      }

      function hasUnsavedChanges() {
        return state.dirty || needsReview();
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
      }

      function iconFor(type) {
        return type === "photo" ? "▦" : type === "voice" ? "◖" : "✎";
      }

      function renderJourney(current) {
        const steps = [
          ["materials", "01", "挑选素材", "照片、语音、文字"],
          ["draft", "02", "整理草稿", "每段保留 sourceRefs"],
          ["review", "03", "核对编辑", "修改不能沿用固定稿依据"],
          ["reader", "04", "确认寄出", "阅读、来源、回复"],
        ];
        const index = steps.findIndex((step) => step[0] === current);
        return `<nav class="journey" aria-label="演示流程">${steps.map((step, stepIndex) => `
          <button type="button" class="journey-step ${stepIndex < index ? "done" : ""} ${stepIndex === index ? "current" : ""}" data-action="journey" data-target="${step[0]}">
            <span class="step-dot">${stepIndex < index ? "✓" : step[1]}</span>
            <span class="step-copy"><b>${step[2]}</b><span>${step[3]}</span></span>
          </button>`).join("")}</nav>`;
      }

      function renderMaterials() {
        return `<aside class="rail" aria-labelledby="materials-title">
          <p class="panel-kicker">CASE_001 / 队友材料接入</p>
          <h2 class="panel-title" id="materials-title">把今天放进来</h2>
          <p class="subtle">${escapeHtml(demoCase.provenanceLabel)}。${controlledMedia ? "下方展示已核验媒体。" : "仓库版仅展示审核后的文字结构。"}</p>
          <div class="material-list">
            ${materials.map((item) => `<button type="button" class="material ${state.selected.has(item.id) ? "selected" : ""}" data-action="toggle-material" data-material="${item.id}" aria-pressed="${state.selected.has(item.id)}">
              <span class="material-icon ${item.type}" aria-hidden="true">${item.icon}</span>
              <span class="material-copy"><b>${item.name}</b><span>${item.detail}</span></span>
              <span class="select-mark" aria-hidden="true">${state.selected.has(item.id) ? "✓" : "○"}</span>
            </button>`).join("")}
          </div>
          <figure class="privacy-view ${controlledMedia && demoCase.photoUrl ? "has-media" : ""}">${controlledMedia && demoCase.photoUrl ? `<img src="${escapeHtml(demoCase.photoUrl)}" alt="物理裁切后的商店货架照片，可见商品和 9.9 元价签" />` : ""}<figcaption class="privacy-mask">${controlledMedia ? "物理裁切 · 原图不入包" : "受控包入口 · 无媒体"}</figcaption></figure>
          ${controlledMedia && demoCase.audioUrl ? `<div class="source-audio"><b>队友提供的原始语音</b><span>8.895 秒 · 仅播放，不做人声克隆或身份识别</span><audio controls preload="metadata" aria-label="队友提供的原始示例语音，8.895 秒" src="${escapeHtml(demoCase.audioUrl)}">当前浏览器不支持音频播放。</audio><a href="${escapeHtml(demoCase.audioUrl)}" download="case-001-audio.m4a">播放失败？下载原始 m4a</a></div>` : ""}
          <div class="rail-footer"><p class="subtle"><b>资料边界：</b>只提取可见货架、商品和 9.9 元价签；不推断购买、食用、功效或人物身份。</p><p class="subtle"><b>核验结果：</b>${safetyTestIds.length ? `${safetyTestIds[0]}-${safetyTestIds[safetyTestIds.length - 1]} 共 ${safetyTestIds.length} 条 PASS` : "受控配置未载入"}。</p></div>
        </aside>`;
      }

      function renderEmptyComposer() {
        const total = state.selected.size;
        return `<main class="composer" aria-labelledby="composer-title">
          <header class="composer-head"><div><p class="panel-kicker">写信人工作台</p><h1 id="composer-title">一封信，从被选择的素材开始。</h1><p class="composer-meta">选择素材后，载入队友已经完成并核验的三版文字。没有被选中的内容不会进入确认版本。</p></div><span class="status-pill count">${total} / ${materials.length} 已选择</span></header>
          <section class="compose-body empty-state"><div><div class="empty-seal" aria-hidden="true">笺</div><h2>查看队友交付的三版家书</h2><p>本步骤载入固定审核稿，不调用 OpenAI，也不会上传文件。CASE-001 的完整版本需要照片和语音两项都被选择。</p><button type="button" class="primary-button" data-action="generate" ${total === materials.length ? "" : "disabled"}>载入 ${approvedDrafts.length} 个固定审核版本</button></div></section>
        </main>`;
      }

      function renderDraftPicker() {
        return `<div class="draft-picker"><p class="draft-picker-label"><span>队友提供的内容版本</span><span>选择后再进入本项目确认流程</span></p><div class="draft-tabs" role="tablist" aria-label="三版温柔家书">${approvedDrafts.map((draft) => `<button id="draft-tab-${escapeHtml(draft.id)}" type="button" role="tab" aria-selected="${state.selectedDraftId === draft.id}" aria-controls="draft-panel" tabindex="${state.selectedDraftId === draft.id ? "0" : "-1"}" class="draft-tab ${state.selectedDraftId === draft.id ? "active" : ""}" data-action="select-draft" data-draft="${escapeHtml(draft.id)}"><b>${escapeHtml(draftDisplayName(draft))}</b><span>${draft.id === demoCase.recommendedDraftId ? "队友主推荐" : escapeHtml(draft.label || "固定审核稿")}</span></button>`).join("")}</div></div>`;
      }

      function renderReview(paragraph) {
        if (paragraph.attribution !== "needs-review") return "";
        const selectedRefs = selectedReviewSourceRefs(paragraph);
        const eligibleMaterials = materials.filter((item) => state.selected.has(item.id));
        return `<div class="source-review" aria-label="段落来源核对">
          <div><h3>这段文字被改过，需要重新说明依据</h3><p>固定审核稿的原有依据不会自动沿用。请只选择能支撑修改后文字的已选素材；页面不会按关键词推断，也不会重新调用模型。</p><fieldset class="review-source-options"><legend class="visually-hidden">选择本段依据</legend>${eligibleMaterials.map((item) => `<label class="review-source-option"><input class="review-source-input" type="checkbox" data-paragraph="${paragraph.id}" data-source="${item.id}" ${selectedRefs.includes(item.id) ? "checked" : ""} /><span>${iconFor(item.type)} ${escapeHtml(item.name)}</span></label>`).join("")}</fieldset></div>
          <div class="review-actions"><button type="button" class="state-action" data-action="confirm-source" data-paragraph="${paragraph.id}" ${selectedRefs.length ? "" : "disabled"}>确认已选素材为依据</button><button type="button" class="state-action user" data-action="mark-user" data-paragraph="${paragraph.id}">标为本人补充</button></div>
        </div>`;
      }

      function renderDraftComposer() {
        const review = needsReview();
        const selectedDraft = approvedDrafts.find((draft) => draft.id === state.selectedDraftId) || recommendedDraft;
        return `<main class="composer" aria-labelledby="composer-title">
          <header class="composer-head"><div><p class="panel-kicker">固定审核稿 / 编辑中</p><h1 id="composer-title">写给家里人的一封信</h1><p class="composer-meta">${escapeHtml(draftDisplayName(selectedDraft))}。可继续编辑；改动后必须重新核对来源才能确认。</p></div><span class="status-pill ${review ? "" : "count"}">${review ? `${state.paragraphs.filter((item) => item.attribution === "needs-review").length} 段待核对` : "固定稿依据已核对"}</span></header>
          <section class="compose-body">${renderDraftPicker()}<article id="draft-panel" class="draft-sheet" role="tabpanel" aria-labelledby="draft-tab-${escapeHtml(selectedDraft.id)}" tabindex="0" aria-label="可编辑的家书草稿"><div class="letter-date">2026.08.28 · CASE-001 固定审核稿</div><h2 class="letter-title">${escapeHtml(demoCase.title || "写给家里人的今天")}</h2><p class="letter-greeting">${escapeHtml(state.greeting)}</p>
            ${state.paragraphs.map((paragraph) => { const meta = attributionMeta[paragraph.attribution]; return `<section class="paragraph-wrap ${state.activeParagraph === paragraph.id ? "active" : ""}" data-paragraph-wrap="${paragraph.id}">
              <label class="visually-hidden" for="${paragraph.id}">第 ${state.paragraphs.indexOf(paragraph) + 1} 段正文</label><textarea class="paragraph-editor" id="${paragraph.id}" data-paragraph="${paragraph.id}" rows="${Math.max(3, Math.ceil(paragraph.text.length / 32))}">${escapeHtml(paragraph.text)}</textarea>
              <div class="paragraph-foot"><span class="source-tag ${meta.className}">${meta.label}</span>${paragraph.sourceRefs.length ? `<span class="source-ref">sourceRefs · ${escapeHtml(selectedNames(paragraph.sourceRefs))}</span>` : ""}</div>${renderReview(paragraph)}
            </section>`; }).join("")}
            <p class="letter-signature">${escapeHtml(state.signature)}</p><div class="provenance-strip"><span class="threads" aria-hidden="true"><i class="thread photo"></i><i class="thread voice"></i></span><span>内容来自队友固定审核稿；照片 / 语音来源进入本项目确认快照，可见、可核对。</span></div>
          </article></section>
        </main>`;
      }

      function renderInspector() {
        const review = needsReview();
        const step = !state.generated ? "materials" : review ? "review" : "draft";
        return `<aside class="inspector" aria-labelledby="status-title"><div><p class="panel-kicker">状态账本</p><h2 class="panel-title" id="status-title">这封信正处于哪里</h2><div class="state-ledger">
          <div class="ledger-row"><i class="ledger-dot current"></i><div><b>素材已主动选择</b><span>${state.selected.size} 条素材会进入本次整理。</span></div></div>
          <div class="ledger-row"><i class="ledger-dot ${state.generated ? "current" : ""}"></i><div><b>队友审核稿${state.generated ? "已载入" : "待载入"}</b><span>本地不调用模型；为固定稿建立 sourceRefs。</span></div></div>
          <div class="ledger-row"><i class="ledger-dot ${review ? "review" : state.generated ? "current" : ""}"></i><div><b>${review ? "有修改待核对" : "编辑来源已解决"}</b><span>${review ? "确认发布被锁定。" : state.generated ? `${resolvedCount()} 段已有归因。` : "编辑后必须作出归因选择。"}</span></div></div>
          <div class="ledger-row"><i class="ledger-dot ${state.published ? "current" : ""}"></i><div><b>${state.published ? "确认版本已寄出" : "等待写信人确认"}</b><span>发布后才允许生成阅读入口。</span></div></div>
        </div></div>
        <section class="confirmation"><h2>${state.generated ? (review ? "先处理这一段修改" : "准备确认寄出") : "等待素材整理"}</h2><p>${state.generated ? (review ? "请为修改后的段落重新选择依据，或标记为本人补充。" : "确认后将固定当前内容，并进入家人阅读端。") : "左侧选择素材后，点击整理草稿。"}</p><button type="button" class="primary-button" data-action="confirm" ${!state.generated || review ? "disabled" : ""}>确认内容，寄出家书</button><div class="safety-note">分享链接在实际服务中有过期与撤销机制；媒体使用独立短期凭据。此页只演示交互状态，不生成真实链接。</div></section>
        </aside>`;
      }

      function renderComposer() {
        const current = !state.generated ? "materials" : needsReview() ? "review" : "draft";
        const publicPagesHost = window.location.hostname.endsWith(".github.io");
        const controlledLink = controlledMedia
          ? ""
          : publicPagesHost
            ? '<a href="https://github.com/KamiZackJ/warm-letter-ai-family" target="_blank" rel="noreferrer">查看项目仓库</a>'
            : '<a href="http://127.0.0.1:4183/" target="_blank" rel="noreferrer">打开受控 CASE-001 离线包</a>';
        return `<div class="app-shell"><header class="topbar"><a class="brand" href="#demo-root" data-action="reset" aria-label="重置暖笺本地演示"><span class="brand-mark" aria-hidden="true">笺</span><span>暖笺</span></a><div class="top-actions"><span class="local-tag">${controlledMedia ? "受控真实素材" : "脱敏仓库版"}</span><button class="quiet-button" type="button" data-action="open-evidence">查看工程依据</button><button class="icon-button" type="button" data-action="reset" aria-label="从头开始本次演示" title="从头开始">↺</button></div></header><div class="demo-note"><b>${controlledMedia ? "队友成果已接入" : "受控媒体未装入"}</b><span>${escapeHtml(demoDisclosure)} 编辑、来源核对、确认快照、阅读和回复由本项目演示承接。</span>${controlledLink}</div>${renderJourney(current)}<section class="workspace" aria-label="暖笺创作工作台">${renderMaterials()}${state.generated ? renderDraftComposer() : renderEmptyComposer()}${renderInspector()}</section>${renderEvidence()}<footer class="footer"><span>暖笺融合产品演示 · 队友内容成果 × 本项目产品闭环</span><span>素材主动选择 → 三版比较 → 来源核对 → 确认 → 阅读与回复</span></footer></div>`;
      }

      function renderReader() {
        const readerClass = state.readerSize === "large" ? "size-large" : state.readerSize === "extra" ? "size-extra" : "";
        const selectedDraft = approvedDrafts.find((draft) => draft.id === state.selectedDraftId) || recommendedDraft;
        const photo = controlledMedia && demoCase.photoUrl ? `<figure class="reader-case-photo"><img src="${escapeHtml(demoCase.photoUrl)}" alt="物理裁切后的商店货架照片，可见商品和 9.9 元价签" /><figcaption class="reader-media-caption">队友提供的生活照片 · 已删除右侧无关人物像素 · 原图不进入可转发包</figcaption></figure>` : "";
        const audio = controlledMedia && demoCase.audioUrl
           ? `<div class="voice-bar real-audio"><b>队友提供的原始语音 · ${Number(demoCase.audioDurationSeconds).toFixed(3)} 秒</b><audio controls preload="metadata" aria-label="队友提供的原始示例语音，${Number(demoCase.audioDurationSeconds).toFixed(3)} 秒" src="${escapeHtml(demoCase.audioUrl)}">当前浏览器不支持音频播放。</audio><a href="${escapeHtml(demoCase.audioUrl)}" download="case-001-audio.m4a">播放失败？下载原始 m4a</a></div>`
          : `<div class="voice-bar"><button type="button" class="voice-button" data-action="voice" aria-label="${state.speaking ? "停止" : "播放"}脱敏语义的系统朗读">${state.speaking ? "■" : "▶"}</button><span class="voice-line" style="--voice-progress:${state.speaking ? "62%" : "0%"}"><span></span></span><span class="voice-time">脱敏系统朗读</span></div>`;
         return `<div class="app-shell"><header class="topbar"><button type="button" class="brand" data-action="back-to-compose" aria-label="返回写信工作台"><span class="brand-mark" aria-hidden="true">笺</span><span>暖笺</span></button><div class="top-actions"><span class="local-tag">${controlledMedia ? "受控素材" : "脱敏模式"} · 已确认</span><button class="quiet-button" type="button" data-action="open-evidence">查看工程依据</button></div></header><div class="demo-note"><b>确认快照</b><span>${escapeHtml(draftDisplayName(selectedDraft))} 已作为当前固定版本进入阅读端。内容来自队友审核稿；页面未调用实时 OpenAI，也不生成外网分享链接。</span></div>${renderJourney("reader")}<section class="reader-stage" aria-label="家人阅读端预览"><aside class="sent-context"><p class="panel-kicker">队友成果 × 本项目闭环</p><h1>固定审核稿，经过确认再进入阅读端。</h1><p>队友提供照片、语音、三版文字与安全核验；本项目把所选版本接入来源映射、确认快照、可读性控制和回复流程。</p><div class="sent-steps"><div class="sent-step"><b>✓</b><span><strong>素材已接入展示</strong><br />团队版使用队友照片的物理裁切图和原始 m4a；原始照片不进入交接包。</span></div><div class="sent-step"><b>✓</b><span><strong>内容口径不混淆</strong><br />三版来自队友固定审核稿，不冒充实时 OpenAI 输出。</span></div><div class="sent-step"><b>✓</b><span><strong>产品能力继续承接</strong><br />来源核对、确认、字号、阅读与回复沿用本项目交互。</span></div></div><button type="button" class="secondary-button" data-action="back-to-compose">返回创作端比较版本</button></aside>
          <article class="reader-phone" aria-label="手机上的家书阅读页面"><header class="phone-top"><button class="phone-icon" type="button" data-action="back-to-compose" aria-label="返回创作端">‹</button><span class="phone-title">暖笺 · 家书</span><button class="phone-icon" type="button" data-action="toggle-sources" aria-label="${state.showSources ? "隐藏" : "显示"}段落来源">⌘</button></header><div class="reader-controls" role="group" aria-label="阅读控制"><button class="reader-control ${state.readerSize === "standard" ? "active" : ""}" type="button" data-action="font" data-size="standard" aria-pressed="${state.readerSize === "standard"}">标准</button><button class="reader-control ${state.readerSize === "large" ? "active" : ""}" type="button" data-action="font" data-size="large" aria-pressed="${state.readerSize === "large"}">大字</button><button class="reader-control ${state.readerSize === "extra" ? "active" : ""}" type="button" data-action="font" data-size="extra" aria-pressed="${state.readerSize === "extra"}">特大</button></div><main class="reader-content ${readerClass}"><div class="reader-date">2026.08.28 · 写信人确认版本 · ${escapeHtml(selectedDraft.id)}</div><h1 class="reader-title">${escapeHtml(demoCase.title || "写给家里人的今天")}</h1>${photo}<div class="reader-letter"><p>${escapeHtml(state.greeting)}</p>${state.paragraphs.map((paragraph) => `<p>${escapeHtml(paragraph.text)}</p>${state.showSources ? `<div class="reader-source"><span class="source-tag ${attributionMeta[paragraph.attribution].className}">${attributionMeta[paragraph.attribution].label}</span>${paragraph.sourceRefs.map((ref) => `<span class="source-tag tag-ai">${iconFor(materialMap[ref].type)} ${escapeHtml(materialMap[ref].name)}</span>`).join("")}</div>` : ""}`).join("")}${audio}<p class="reader-signature">${escapeHtml(state.signature)}</p></div></main><section class="reply-area" aria-labelledby="reply-title"><h2 id="reply-title">留一句话</h2><form class="reply-form" data-action="reply"><label class="visually-hidden" for="reply-input">回复家书</label><input id="reply-input" class="reply-input" name="reply" maxlength="240" placeholder="读完想说的话" required /><button class="reply-send" aria-label="发送回复" title="发送回复" type="submit">↑</button></form>${state.replies.length ? `<div class="reply-list" aria-live="polite">${state.replies.map((reply) => `<div class="reply"><b>家人：</b>${escapeHtml(reply)}</div>`).join("")}</div>` : ""}</section></article>
          <aside class="reader-right"><section class="property-sheet"><p class="panel-kicker">发布后的控制</p><h2>不是一条永不过期的公开链接</h2><dl><dt>读信凭据</dt><dd>可过期、可撤销</dd><dt>媒体访问</dt><dd>独立短期凭据</dd><dt>语音呈现</dt><dd>系统朗读，不克隆声音</dd><dt>回复处理</dt><dd>安全校验与幂等</dd></dl></section><section class="source-preview"><p class="panel-kicker" style="color:#b9dfd2">同一份产品依据</p><h2>每个动作，都有现有工程支撑。</h2><p>展开下方抽屉，可直接定位到小程序、API 和 H5 的对应实现文件。</p><button type="button" data-action="open-evidence">展开工程依据</button></section></aside></section>${renderEvidence()}<footer class="footer"><span>暖笺互动产品演示 · 本地确认版本</span><span>可回到创作端重走编辑与归因流程</span></footer></div>`;
      }

      function renderEvidence() {
        return `<details class="evidence-drawer" id="evidence"><summary>融合依据：队友材料如何接入现有产品能力</summary><div class="evidence-content"><div><h2>本轮实际接入</h2><ul class="evidence-list"><li><b>队友内容成果</b><br />照片、8.895 秒 m4a、A/B/C 三版家书、evidence_map、privacy_review 与 T01-T07。</li><li><b>隐私处理</b><br />团队包只含物理裁切派生图；原始照片不入 Git、不入可转发包，不描述或识别无关人物。</li><li><b>确认与来源</b><br /><code>apps/miniprogram/src/utils/paragraph-attribution.ts</code><br /><code>apps/api/src/service.ts</code></li><li><b>H5 阅读与回复</b><br /><code>apps/web/src/main.tsx</code></li></ul></div><div><h2>验收与边界</h2><ul class="evidence-list"><li><b>内容安全 ${safetyTestIds.length ? "PASS" : "未载入"}</b><br />${safetyTestIds.length ? `${safetyTestIds.join("、")} 共 ${safetyTestIds.length} 条固定验收通过。` : "请重新生成受控团队包。"}</li><li><b>媒体完整性</b><br />照片与语音在打包前按 SHA-256 校验；包内 manifest 仅记录相对路径。</li><li><b>能力声明</b><br />固定审核稿，不是实时 OpenAI；本地阅读预览，不是微信双真机或生产部署。</li></ul><p class="drawer-note">${escapeHtml(demoDisclosure)}</p></div></div></details>`;
      }

      function bindEvents() {
        document.querySelectorAll("[data-action]").forEach((element) => {
          element.addEventListener("click", (event) => {
            const action = element.dataset.action;
            if (action === "toggle-material") {
              const id = element.dataset.material;
              if (state.generated) { showToast("草稿已生成。重选素材后请从头开始一次演示。"); return; }
              state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
              render();
            }
            if (action === "generate") {
              if (state.selected.size !== materials.length) { showToast("CASE-001 需要照片和语音两项素材都被选择。"); return; }
              const parsed = parseApprovedDraft(recommendedDraft);
              state.generated = true;
              state.dirty = false;
              state.selectedDraftId = recommendedDraft.id;
              state.greeting = parsed.greeting;
              state.signature = parsed.signature;
              state.paragraphs = structuredClone(parsed.paragraphs);
              state.activeParagraph = state.paragraphs[0]?.id || "";
              render();
              showToast("已载入队友主推荐 A 版。可比较 B/C，或编辑后核对来源。");
            }
            if (action === "select-draft") {
              const draft = approvedDrafts.find((item) => item.id === element.dataset.draft);
              if (!draft) return;
              if (draft.id !== state.selectedDraftId && hasUnsavedChanges() && !window.confirm("当前版本有未保存修改，切换版本会丢失这些修改。是否继续？")) return;
              const parsed = parseApprovedDraft(draft);
              state.selectedDraftId = draft.id;
              state.dirty = false;
              state.greeting = parsed.greeting;
              state.signature = parsed.signature;
              state.paragraphs = structuredClone(parsed.paragraphs);
              state.activeParagraph = state.paragraphs[0]?.id || "";
              render();
              showToast(`已切换到队友提供的 ${draft.name}。`);
            }
            if (action === "confirm-source") {
              const paragraph = state.paragraphs.find((item) => item.id === element.dataset.paragraph);
              if (!paragraph) return;
              const sourceRefs = selectedReviewSourceRefs(paragraph);
              if (!sourceRefs.length) { showToast("请先选择能支撑本段文字的素材。 "); return; }
              paragraph.attribution = "sources-confirmed";
              paragraph.sourceRefs = sourceRefs;
              paragraph.evidenceIds = [];
              paragraph.reviewSourceRefs = [];
              state.dirty = needsReview();
              render();
              showToast(`已记录本段依据：${selectedNames(sourceRefs)}。`);
            }
            if (action === "mark-user") {
              const paragraph = state.paragraphs.find((item) => item.id === element.dataset.paragraph);
              if (!paragraph) return;
              paragraph.attribution = "user-supplied";
              paragraph.sourceRefs = [];
              paragraph.evidenceIds = [];
              paragraph.reviewSourceRefs = [];
              state.dirty = needsReview();
              render();
              showToast("已标记为写信人补充，不再引用任何素材。");
            }
            if (action === "confirm") {
              if (!state.generated || needsReview()) { showToast("请先完成每一段修改的来源核对。"); return; }
              state.published = true;
              state.speaking = false;
              render();
              showToast("确认版本已寄出。现在是收信人的阅读端。 ");
            }
            if (action === "back-to-compose") { state.speaking = false; state.published = false; render(); }
            if (action === "toggle-sources") { state.showSources = !state.showSources; render(); }
            if (action === "font") { state.readerSize = element.dataset.size; render(); }
            if (action === "voice") {
              if (controlledMedia && demoCase.audioUrl) return;
              state.speaking = !state.speaking;
              if (state.speaking && "speechSynthesis" in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("开完会有点累。外卖多附了一杯饮品，让人觉得很开心。");
                utterance.lang = "zh-CN";
                utterance.rate = 0.9;
                utterance.onend = () => { state.speaking = false; render(); };
                window.speechSynthesis.speak(utterance);
              } else if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); }
              render();
            }
            if (action === "open-evidence") {
              const drawer = document.querySelector("#evidence");
              drawer.open = true;
              drawer.scrollIntoView({ behavior: "smooth", block: "start" });
            }
            if (action === "reset") {
              state.generated = false; state.published = false; state.dirty = false; state.selected = new Set(materials.map((item) => item.id)); state.selectedDraftId = recommendedDraft.id; state.greeting = initialDraft.greeting; state.signature = initialDraft.signature; state.paragraphs = structuredClone(initialParagraphs); state.activeParagraph = initialParagraphs[0]?.id || ""; state.showSources = false; state.readerSize = "standard"; state.replies = []; state.speaking = false;
              if ("speechSynthesis" in window) window.speechSynthesis.cancel();
              render();
              showToast("已回到演示起点。");
            }
            if (action === "journey") {
              const target = element.dataset.target;
              if (target === "reader" && !state.published) { showToast("确认家书后，才能进入收信人阅读端。 "); return; }
              if (target === "materials") { state.generated = false; state.published = false; render(); return; }
              if (target === "draft" && !state.generated) { showToast("请先整理草稿。 "); return; }
              if (target === "review" && !state.generated) { showToast("请先整理草稿，再编辑段落并核对来源。 "); return; }
              render();
            }
          });
        });
        const syncParagraphEditor = (editor) => {
          const paragraph = state.paragraphs.find((item) => item.id === editor.dataset.paragraph);
          if (!paragraph || paragraph.text === editor.value) return;
          const selectionStart = editor.selectionStart ?? editor.value.length;
          const selectionEnd = editor.selectionEnd ?? selectionStart;
          const editorScrollTop = editor.scrollTop;
          paragraph.text = editor.value;
          paragraph.attribution = "needs-review";
          state.dirty = true;
          paragraph.sourceRefs = [];
          paragraph.evidenceIds = [];
          paragraph.reviewSourceRefs = [];
          state.activeParagraph = paragraph.id;
          render();
          const nextEditor = document.querySelector(`#${paragraph.id}`);
          if (!nextEditor) return;
          nextEditor.focus({ preventScroll: true });
          nextEditor.setSelectionRange(selectionStart, selectionEnd);
          nextEditor.scrollTop = editorScrollTop;
        };
        document.querySelectorAll(".paragraph-editor").forEach((editor) => {
          let composing = false;
          editor.addEventListener("compositionstart", () => { composing = true; });
          editor.addEventListener("compositionend", () => {
            composing = false;
            syncParagraphEditor(editor);
          });
          editor.addEventListener("input", () => {
            if (!composing) syncParagraphEditor(editor);
          });
          editor.addEventListener("focus", () => { state.activeParagraph = editor.dataset.paragraph; });
        });
        document.querySelectorAll(".review-source-input").forEach((input) => {
          input.addEventListener("change", () => {
            const paragraph = state.paragraphs.find((item) => item.id === input.dataset.paragraph);
            const sourceId = input.dataset.source;
            if (!paragraph || !sourceId || !knownMaterialIds.has(sourceId)) return;
            const refs = new Set(selectedReviewSourceRefs(paragraph));
            input.checked ? refs.add(sourceId) : refs.delete(sourceId);
            paragraph.reviewSourceRefs = [...refs];
            state.activeParagraph = paragraph.id;
            render();
            document.querySelector(`.review-source-input[data-paragraph="${paragraph.id}"][data-source="${sourceId}"]`)?.focus();
          });
        });
        document.querySelectorAll(".draft-tab").forEach((tab, index, tabs) => {
          tab.addEventListener("keydown", (event) => {
            if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
            event.preventDefault();
            const nextIndex = event.key === "Home"
              ? 0
              : event.key === "End"
                ? tabs.length - 1
                : (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
            const nextTab = tabs[nextIndex];
            nextTab?.focus();
            nextTab?.click();
          });
        });
        document.querySelector(".reply-form")?.addEventListener("submit", (event) => {
          event.preventDefault();
          const input = event.currentTarget.querySelector("input[name=reply]");
          const text = input.value.trim();
          if (!text) return;
          state.replies.push(text);
          render();
          showToast("回复已保存到本地演示状态。实际服务会进行安全校验和幂等处理。");
        });
      }

      function render() {
        root.innerHTML = state.published ? renderReader() : renderComposer();
        bindEvents();
      }

      render();
    </script>
    <style>.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }</style>
  </body>
</html>
