name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @warm-letter/web verify:production-bundle
        env:
          WARM_LETTER_TMP_DIR: ${{ runner.temp }}
